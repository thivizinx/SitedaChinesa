<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Um Presente Para Você 💝</title>

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="presente.css">
</head>
<body>

    <!-- Fundo romântico -->
    <div class="floating-hearts">
        <span class="heart">♥</span>
        <span class="heart">♥</span>
        <span class="heart">♥</span>
        <span class="heart">♥</span>
    </div>

    <main class="gift-container">
        <h1 class="gift-title fade-in">
            Para a pessoa que mudou minha vida 💕
        </h1>

        <p class="gift-text fade-in-delay">
            Esse presente não cabe em uma caixa…<br>
            Porque tudo o que sinto por você<br>
            é maior do que qualquer laço.
        </p>

        <!-- Ícone de presente -->
        <div class="gift-box fade-in-delay-2">
            🎁
        </div>

        <!-- BOTÃO -->
        <a href="page.html" class="open-gift-button fade-in-delay-3">
            Clique aqui para abrir o presente 💖
        </a>

        <p class="gift-footer fade-in-delay-4">
            Feito com amor, por alguém que te ama todos os dias
        </p>
    </main>

</body>
</html>
